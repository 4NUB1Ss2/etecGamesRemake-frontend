<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <style>
        .body  { fill: #6e42ca; }
        .light { fill: #ffffff; }
        @media (prefers-color-scheme: light) {
        .body  { fill: #5a32b0; }
        .light { fill: #ffffff; }
        }
    </style>
    <!-- Controller body — fills more of the viewbox -->
    <rect x="4" y="14" width="56" height="30" rx="15" class="body"/>
    <!-- Left grip -->
    <path d="M8 34 Q1 37 3 46 Q5 53 13 51 Q21 49 19 41" class="body"/>
    <!-- Right grip -->
    <path d="M56 34 Q63 37 61 46 Q59 53 51 51 Q43 49 45 41" class="body"/>
    <!-- D-pad vertical -->
    <rect x="16" y="20" width="6" height="16" rx="3" class="light"/>
    <!-- D-pad horizontal -->
    <rect x="11" y="25" width="16" height="6" rx="3" class="light"/>
    <!-- Face buttons -->
    <circle cx="46" cy="22" r="4" class="light" opacity="0.95"/>
    <circle cx="46" cy="34" r="4" class="light" opacity="0.95"/>
    <circle cx="40" cy="28" r="4" class="light" opacity="0.6"/>
    <circle cx="52" cy="28" r="4" class="light" opacity="0.6"/>
    <!-- Center -->
    <circle cx="32" cy="29" r="3.5" class="light" opacity="0.3"/>
</svg>